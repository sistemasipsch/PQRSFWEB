<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de fondo claro y brillante -->
    <linearGradient id="clearBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6f7fc"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular limpio con borde cian institucional de alto contraste -->
  <circle cx="32" cy="32" r="30" fill="url(#clearBg)" stroke="#0099cc" stroke-width="3"/>

  <!-- Cruz médica de fondo en tono suave para contextualizar salud -->
  <rect x="29" y="14" width="6" height="18" rx="2" fill="#e0f2fe" opacity="0.8"/>
  <rect x="23" y="20" width="18" height="6" rx="2" fill="#e0f2fe" opacity="0.8"/>

  <!-- ESTETOSCOPIO INSTITUCIONAL CLINICAL HOUSE (Líneas gruesas y de máxima claridad) -->
  <!-- Olivas auriculares (Earpieces) -->
  <circle cx="20" cy="15" r="3" fill="#003865"/>
  <circle cx="44" cy="15" r="3" fill="#003865"/>

  <!-- Binaurales metálicos -->
  <path d="M20 18 C20 27, 28 32, 32 33 C36 32, 44 27, 44 18" 
        fill="none" stroke="#003865" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Tubo flexible en 'U' distintivo en Cyan Clinical House -->
  <path d="M32 33 V38 C32 46, 19 45, 19 38 C19 31, 30 30, 30 39 C30 48, 43 49, 43 43" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Campana médica (Chestpiece) con diafragma de alto contraste -->
  <circle cx="43" cy="48" r="8" fill="#003865" stroke="#ffffff" stroke-width="2"/>
  <circle cx="43" cy="48" r="4" fill="#00c3ff"/>
</svg>
